name: E2E

# Cypress against a fresh single-node Rancher started on the runner. Manual only for now: the
# environment script that adds a downstream cluster, CloudNativePG and Studio lands with the
# features that need them, and then this workflow joins pull requests and a nightly schedule.
on:
  workflow_dispatch:
    inputs:
      rancher_image:
        description: Rancher image to test against
        required: true
        default: rancher/rancher:v2.15-head

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ inputs.rancher_image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install from the lockfile
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install the Cypress binary
        run: yarn cypress install

      - name: Start Rancher
        env:
          RANCHER_IMAGE: ${{ inputs.rancher_image }}
        run: |
          set -euo pipefail
          bootstrap="$(openssl rand -hex 16)"
          echo "::add-mask::$bootstrap"
          # A step output holding a masked value is dropped, so the job environment carries it.
          echo "CATTLE_BOOTSTRAP_PASSWORD=$bootstrap" >> "$GITHUB_ENV"
          docker run -d --name rancher --privileged --restart=no \
            -p 127.0.0.1:8443:443 \
            -e CATTLE_BOOTSTRAP_PASSWORD="$bootstrap" \
            "$RANCHER_IMAGE"
          # scripts/e2e/run.sh waits for the dashboard itself; this only fails fast on a dead server.
          for _ in $(seq 1 60); do
            if curl -fsSk https://127.0.0.1:8443/ping >/dev/null 2>&1; then
              echo "Rancher answers /ping"
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 200 rancher
          exit 1

      - name: Build the extension package
        run: yarn build-pkg libredb-studio

      - name: Run the end-to-end specs
        env:
          TEST_BASE_URL: https://127.0.0.1:8443/dashboard
          TEST_USERNAME: admin
          TEST_SKIP: ''
          TEST_ONLY: setup,extensions
          TEST_NO_VIDEOS: 'true'
        run: scripts/e2e/run.sh

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/reports
            browser-logs
          if-no-files-found: ignore
