# Publishes the Extension Catalog Image to GHCR for air-gapped installs. Runs only on a published
# GitHub release tagged libredb-studio-rancher-extension-<root version>, or by hand.

name: Build and Release Extension Catalog

on:
  workflow_dispatch:
  release:
    types: [released]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build-extension-catalog:
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@8ded74ce753910cb3c12bbb72a6c02c5ca0ab68c # master 2026-10-27
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      registry_target: ghcr.io
      registry_user: ${{ github.actor }}
      tagged_release: ${{ github.ref_name }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
