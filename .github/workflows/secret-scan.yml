name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # gitleaks v8.30.1, pinned by digest.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The scan reads history; a shallow checkout would make the range empty, and an empty
          # range passes.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # One definition of the range feeds both the scan and the count, and first-parent diffs
            # keep a secret added while resolving a merge conflict visible.
            range="--diff-merges=first-parent $BASE_SHA..$HEAD_SHA"
            echo "log_opts=$range" >> "$GITHUB_OUTPUT"
            # gitleaks logs an unresolvable range and still exits 0, so resolve it here under set -e.
            # The range is split into words on purpose: it holds an option and a revision range.
            # shellcheck disable=SC2086
            echo "commit_count=$(git rev-list --count $range)" >> "$GITHUB_OUTPUT"
          else
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "::error::Shallow checkout: --all would scan a truncated history." >&2
              exit 1
            fi
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for committed secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$GITLEAKS_IMAGE" git \
              --no-banner \
              --redact \
              --config /repo/.gitleaks.toml \
              --log-opts="$LOG_OPTS"

      - name: Assert the scan covered commits
        if: github.event_name == 'pull_request'
        env:
          COMMIT_COUNT: ${{ steps.range.outputs.commit_count }}
        run: |
          set -euo pipefail
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::The pull request range scanned 0 commits, so the scan verified nothing." >&2
            exit 1
          fi
          echo "Scanned $COMMIT_COUNT commit(s)."
